[project]
name = "askdocs"
version = "0.1.0"
description = "Production-style RAG over docs: hybrid retrieval, reranking, enforced citations, eval-gated CI"
readme = "README.md"
authors = [
    { name = "Sirpreet Dhillon" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.11.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.56.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client[fastembed]>=1.15",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.67.0",
]
mcp = [
    "mcp>=1.10",
]

[project.scripts]
askdocs = "askdocs.cli:main"
askdocs-mcp = "askdocs.mcp_server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # the formatter owns line length
