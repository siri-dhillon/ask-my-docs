# One command: `docker compose up --build` -> Qdrant + ingest job + API (:8000) + UI (:8501)
services:
  qdrant:
    image: qdrant/qdrant:v1.16.0
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      retries: 20

  ingest:
    build: .
    command: ["uv", "run", "--no-sync", "askdocs", "ingest"]
    env_file: [.env]
    environment:
      ASKDOCS_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant: { condition: service_healthy }

  api:
    build: .
    env_file: [.env]
    environment:
      ASKDOCS_QDRANT_URL: http://qdrant:6333
    ports: ["8000:8000"]
    depends_on:
      ingest: { condition: service_completed_successfully }

  ui:
    build: .
    command: ["uv", "run", "--no-sync", "streamlit", "run", "ui/streamlit_app.py", "--server.address=0.0.0.0"]
    environment:
      ASKDOCS_API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data:
