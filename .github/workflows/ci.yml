name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      id-token: write   # lets the job request a GitHub OIDC token (keyless auth to the Claude API)
      contents: read
    env:
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
      # Workload Identity Federation: identifiers only, no secret. Set as repo *variables*.
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      WIF_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}  # only needed if the rule spans several workspaces
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-oidc.jwt
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache embedding / reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('src/askdocs/config.py') }}
      - name: Build index
        run: uv run askdocs ingest
      - name: Eval (retrieval always; answers when Workload Identity Federation is configured)
        run: |
          if [ -n "$ANTHROPIC_FEDERATION_RULE_ID" ]; then
            fetch_jwt() {
              curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" && mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.tmp" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            }
            if [ -n "$WIF_WORKSPACE_ID" ]; then export ANTHROPIC_WORKSPACE_ID="$WIF_WORKSPACE_ID"; fi
            fetch_jwt
            # GitHub OIDC tokens expire after ~5 min and the eval runs longer: keep the file fresh
            ( while sleep 180; do fetch_jwt; done ) &
            uv run python eval/run_eval.py --check eval/eval_thresholds.yaml
          else
            echo "::notice::Workload Identity Federation not configured - running retrieval-only eval"
            uv run python eval/run_eval.py --retrieval-only --check eval/eval_thresholds.yaml
          fi
      - name: Job summary
        if: always()
        run: |
          echo "## Eval results" >> "$GITHUB_STEP_SUMMARY"
          cat eval/reports/results.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/
